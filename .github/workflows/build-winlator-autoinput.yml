name: Winlator 11.1 AutoInput APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patch-repo

      - name: Checkout Winlator 11.1 app source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: 86b60043afee150b9bd3567d24abe349d8a723c4
          path: winlator

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Verify Winlator source layout
        working-directory: winlator
        run: |
          test -f app/src/main/java/com/winlator/xserver/XServer.java
          test -f app/src/main/java/com/winlator/widget/TouchpadView.java
          test -f app/src/main/java/com/winlator/XServerDisplayActivity.java
          test -f app/src/main/java/com/winlator/core/NetworkHelper.java
          test -f app/src/main/java/com/winlator/xenvironment/components/NetworkInfoUpdateComponent.java
          test -f app/src/main/java/com/winlator/xserver/Keyboard.java
          echo "Winlator 11.1 source layout OK"

      - name: Apply AutoInput, Network, Wi-Fi and automatic Keyboard patches
        working-directory: winlator
        run: |
          mkdir -p app/src/main/java/com/winlator/inputcontrols
          cp ../patch-repo/patches/ExternalInputDeviceManager.java app/src/main/java/com/winlator/inputcontrols/ExternalInputDeviceManager.java
          cp ../patch-repo/patches/ExternalKeyboardManager.java app/src/main/java/com/winlator/inputcontrols/ExternalKeyboardManager.java
          python3 ../patch-repo/patches/apply_autoinput.py
          python3 ../patch-repo/patches/fix_external_mouse_motion.py
          python3 ../patch-repo/patches/fix_external_mouse_dispatch.py
          python3 ../patch-repo/patches/fix_network.py
          python3 ../patch-repo/patches/add_windows_wifi_panel.py
          python3 ../patch-repo/patches/enable_auto_keyboard.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/winlator/WifiNetworkFragment.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ContextCompat.registerReceiver(requireContext(), receiver, f, ContextCompat.RECEIVER_NOT_EXPORTED);', 'requireContext().registerReceiver(receiver, f);')
          p.write_text(s, encoding='utf-8')
          print('Wi-Fi receiver compatibility fix applied')
          PY

      - name: Fix native library packaging conflicts
        working-directory: winlator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          anchor = "    lintOptions {"
          libs = ('libFLAC.so','libfluidsynth.so','libfluidsynth-assetloader.so','libgio-2.0.so','libglib-2.0.so','libgmodule-2.0.so','libgobject-2.0.so','libgthread-2.0.so','libinstpatch-1.0.so')
          if 'packagingOptions {' not in s:
              block = "    packagingOptions {\n        pickFirst '**/*.so'\n" + ''.join(f"        pickFirst 'lib/arm64-v8a/{lib}'\n" for lib in libs) + "    }\n\n"
              if anchor not in s: raise SystemExit('Gradle packaging anchor not found')
              s = s.replace(anchor, block + anchor, 1)
          elif "        pickFirst '**/*.so'" not in s:
              s = s.replace("    }\n\n    lintOptions {", "        pickFirst '**/*.so'\n    }\n\n    lintOptions {", 1)
          p.write_text(s)
          PY

      - name: Verify patched sources
        working-directory: winlator
        run: |
          grep -q "ExternalInputDeviceManager" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q "injectPointerButtonState" app/src/main/java/com/winlator/xserver/XServer.java
          grep -q "syncExternalMouseButtons" app/src/main/java/com/winlator/widget/TouchpadView.java
          grep -q "AXIS_RELATIVE_X" app/src/main/java/com/winlator/widget/TouchpadView.java
          grep -q "AXIS_RELATIVE_Y" app/src/main/java/com/winlator/widget/TouchpadView.java
          grep -q "isExternalMouse" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q "getDNSAddresses" app/src/main/java/com/winlator/core/NetworkHelper.java
          grep -q "getGatewayAddress" app/src/main/java/com/winlator/core/NetworkHelper.java
          grep -q "resolv.conf" app/src/main/java/com/winlator/xenvironment/components/NetworkInfoUpdateComponent.java
          grep -q "network-status" app/src/main/java/com/winlator/xenvironment/components/NetworkInfoUpdateComponent.java
          grep -q "class WifiNetworkFragment" app/src/main/java/com/winlator/WifiNetworkFragment.java
          grep -q "MENU_WIFI_NETWORK" app/src/main/java/com/winlator/MainActivity.java
          grep -q "NEARBY_WIFI_DEVICES" app/src/main/AndroidManifest.xml
          grep -q "WifiNetworkSuggestion" app/src/main/java/com/winlator/WifiNetworkFragment.java
          grep -q "class ExternalKeyboardManager" app/src/main/java/com/winlator/inputcontrols/ExternalKeyboardManager.java
          grep -q "isExternalKeyboard(event)" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q "source keyboard" app/src/main/java/com/winlator/inputcontrols/ExternalKeyboardManager.java || true
          grep -q "xServer.keyboard.onKeyEvent(event)" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q "keyCode >= 0 && keyCode < keycodeMap.length" app/src/main/java/com/winlator/xserver/Keyboard.java
          grep -q "pickFirst '\*\*/\*.so'" app/build.gradle
          echo "AutoInput + Network + Windows Wi-Fi + automatic USB/Bluetooth Keyboard verification OK"

      - name: Make Gradle executable
        working-directory: winlator
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: winlator
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-11.1-AutoInput-WifiPanel-AutoKeyboard-debug
          path: winlator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
