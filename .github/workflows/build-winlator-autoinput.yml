name: Winlator 11.1 AutoInput APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patch-repo

      - name: Checkout Winlator 11.1 app source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: 86b60043afee150b9bd3567d24abe349d8a723c4
          path: winlator

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Verify Winlator source layout
        working-directory: winlator
        run: |
          test -f app/src/main/java/com/winlator/xserver/XServer.java
          test -f app/src/main/java/com/winlator/widget/TouchpadView.java
          test -f app/src/main/java/com/winlator/XServerDisplayActivity.java
          echo "Winlator 11.1 source layout OK"

      - name: Apply AutoInput patch
        working-directory: winlator
        run: |
          mkdir -p app/src/main/java/com/winlator/inputcontrols
          cp ../patch-repo/patches/ExternalInputDeviceManager.java app/src/main/java/com/winlator/inputcontrols/ExternalInputDeviceManager.java
          python3 ../patch-repo/patches/apply_autoinput.py

      - name: Fix native library packaging conflicts
        working-directory: winlator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          anchor = "    lintOptions {"
          libs = (
              'libFLAC.so',
              'libfluidsynth.so',
              'libfluidsynth-assetloader.so',
              'libgio-2.0.so',
              'libglib-2.0.so',
              'libgmodule-2.0.so',
              'libgobject-2.0.so',
              'libgthread-2.0.so',
          )
          if 'packagingOptions {' not in s:
              block = "    packagingOptions {\n" + ''.join(f"        pickFirst 'lib/arm64-v8a/{lib}'\n" for lib in libs) + "    }\n\n"
              if anchor not in s:
                  raise SystemExit('Gradle packaging anchor not found')
              s = s.replace(anchor, block + anchor, 1)
          else:
              for lib in libs:
                  line = f"        pickFirst 'lib/arm64-v8a/{lib}'"
                  if line not in s:
                      if "    }\n\n    lintOptions {" not in s:
                          raise SystemExit('Existing packagingOptions block not found')
                      s = s.replace("    }\n\n    lintOptions {", f"    {line}\n    }}\n\n    lintOptions {{", 1)
          p.write_text(s)
          print('Native library packaging rules applied')
          PY

      - name: Verify patched sources
        working-directory: winlator
        run: |
          grep -q "ExternalInputDeviceManager" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q "injectPointerButtonState" app/src/main/java/com/winlator/xserver/XServer.java
          grep -q "syncExternalMouseButtons" app/src/main/java/com/winlator/widget/TouchpadView.java
          grep -q "pickFirst 'lib/arm64-v8a/libFLAC.so'" app/build.gradle
          grep -q "pickFirst 'lib/arm64-v8a/libfluidsynth.so'" app/build.gradle
          grep -q "pickFirst 'lib/arm64-v8a/libfluidsynth-assetloader.so'" app/build.gradle
          grep -q "pickFirst 'lib/arm64-v8a/libgio-2.0.so'" app/build.gradle
          grep -q "pickFirst 'lib/arm64-v8a/libglib-2.0.so'" app/build.gradle
          grep -q "pickFirst 'lib/arm64-v8a/libgmodule-2.0.so'" app/build.gradle
          grep -q "pickFirst 'lib/arm64-v8a/libgobject-2.0.so'" app/build.gradle
          grep -q "pickFirst 'lib/arm64-v8a/libgthread-2.0.so'" app/build.gradle
          echo "AutoInput patch verification OK"

      - name: Make Gradle executable
        working-directory: winlator
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: winlator
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-11.1-AutoInput-debug
          path: winlator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
