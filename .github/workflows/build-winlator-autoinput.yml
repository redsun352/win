name: Winlator 11.1 AutoInput APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patch-repo

      - name: Checkout Winlator 11.1 app source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: 86b60043afee150b9bd3567d24abe349d8a723c4
          path: winlator

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Verify Winlator source layout
        working-directory: winlator
        run: |
          test -f app/src/main/java/com/winlator/xserver/XServer.java
          test -f app/src/main/java/com/winlator/widget/TouchpadView.java
          test -f app/src/main/java/com/winlator/XServerDisplayActivity.java
          test -f app/src/main/java/com/winlator/core/NetworkHelper.java
          test -f app/src/main/java/com/winlator/xenvironment/components/NetworkInfoUpdateComponent.java
          test -f app/src/main/java/com/winlator/xserver/Keyboard.java
          echo "Winlator 11.1 source layout OK"

      - name: Apply AutoInput, Network, Wi-Fi, Keyboard and Screen patches
        working-directory: winlator
        run: |
          mkdir -p app/src/main/java/com/winlator/inputcontrols
          cp ../patch-repo/patches/ExternalInputDeviceManager.java app/src/main/java/com/winlator/inputcontrols/ExternalInputDeviceManager.java
          cp ../patch-repo/patches/ExternalKeyboardManager.java app/src/main/java/com/winlator/inputcontrols/ExternalKeyboardManager.java
          python3 ../patch-repo/patches/apply_autoinput.py
          python3 ../patch-repo/patches/fix_external_mouse_motion.py
          python3 ../patch-repo/patches/fix_external_mouse_dispatch.py
          python3 ../patch-repo/patches/fix_network.py
          python3 ../patch-repo/patches/add_windows_wifi_panel.py
          python3 ../patch-repo/patches/fix_wifi_connection.py
          python3 ../patch-repo/patches/enable_auto_keyboard.py
          python3 ../patch-repo/patches/auto_screen_resolution.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/winlator/WifiNetworkFragment.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ContextCompat.registerReceiver(requireContext(), receiver, f, ContextCompat.RECEIVER_NOT_EXPORTED);', 'requireContext().registerReceiver(receiver, f);')
          p.write_text(s, encoding='utf-8')
          print('Wi-Fi receiver compatibility fix applied')
          PY

      - name: Fix native library packaging conflicts
        working-directory: winlator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          libs = ('libFLAC.so','libfluidsynth.so','libfluidsynth-assetloader.so','libgio-2.0.so','libglib-2.0.so','libgmodule-2.0.so','libgobject-2.0.so','libgthread-2.0.so','libinstpatch-1.0.so')
          block = "    packagingOptions {\n        pickFirst '**/*.so'\n" + ''.join(f"        pickFirst 'lib/arm64-v8a/{lib}'\n" for lib in libs) + "    }\n\n"
          if 'packagingOptions {' not in s:
              anchors = ['    lintOptions {', '    buildTypes {', 'android {']
              anchor = next((a for a in anchors if a in s), None)
              if anchor is None:
                  raise SystemExit('No Gradle insertion anchor found')
              s = s.replace(anchor, block + anchor, 1)
          elif "pickFirst '**/*.so'" not in s:
              s = s.replace('    packagingOptions {', '    packagingOptions {\n        pickFirst \'**/*.so\'\n', 1)
          p.write_text(s)
          print('Gradle packaging rules:')
          for line in s.splitlines():
              if 'packagingOptions' in line or 'pickFirst' in line:
                  print(line)
          PY

      - name: Verify patched sources
        working-directory: winlator
        run: |
          grep -Fq "ExternalInputDeviceManager" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -Fq "injectPointerButtonState" app/src/main/java/com/winlator/xserver/XServer.java
          grep -Fq "syncExternalMouseButtons" app/src/main/java/com/winlator/widget/TouchpadView.java
          grep -Fq "AXIS_RELATIVE_X" app/src/main/java/com/winlator/widget/TouchpadView.java
          grep -Fq "AXIS_RELATIVE_Y" app/src/main/java/com/winlator/widget/TouchpadView.java
          grep -Fq "isExternalMouse" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -Fq "getDNSAddresses" app/src/main/java/com/winlator/core/NetworkHelper.java
          grep -Fq "getGatewayAddress" app/src/main/java/com/winlator/core/NetworkHelper.java
          grep -Fq "getIPv4BroadcastAddress" app/src/main/java/com/winlator/core/NetworkHelper.java
          grep -Fq "registerDefaultNetworkCallback" app/src/main/java/com/winlator/xenvironment/components/NetworkInfoUpdateComponent.java
          grep -Fq "MulticastLock" app/src/main/java/com/winlator/xenvironment/components/NetworkInfoUpdateComponent.java
          grep -Fq "network-broadcast" app/src/main/java/com/winlator/xenvironment/components/NetworkInfoUpdateComponent.java
          grep -Fq "resolv.conf" app/src/main/java/com/winlator/xenvironment/components/NetworkInfoUpdateComponent.java
          grep -Fq "network-status" app/src/main/java/com/winlator/xenvironment/components/NetworkInfoUpdateComponent.java
          grep -Fq "class WifiNetworkFragment" app/src/main/java/com/winlator/WifiNetworkFragment.java
          grep -Fq "MENU_WIFI_NETWORK" app/src/main/java/com/winlator/MainActivity.java
          grep -Fq "NEARBY_WIFI_DEVICES" app/src/main/AndroidManifest.xml
          grep -Fq "CHANGE_WIFI_STATE" app/src/main/AndroidManifest.xml
          grep -Fq "WifiNetworkSuggestion" app/src/main/java/com/winlator/WifiNetworkFragment.java
          grep -Fq "setWpa3Passphrase" app/src/main/java/com/winlator/WifiNetworkFragment.java
          grep -Fq "removeNetworkSuggestions" app/src/main/java/com/winlator/WifiNetworkFragment.java
          grep -Fq "class ExternalKeyboardManager" app/src/main/java/com/winlator/inputcontrols/ExternalKeyboardManager.java
          grep -Fq "isExternalKeyboard(event)" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -Fq "xServer.keyboard.onKeyEvent(event)" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -Fq "keyCode >= 0 && keyCode < keycodeMap.length" app/src/main/java/com/winlator/xserver/Keyboard.java
          grep -Fq "autoDetectScreenInfo" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -Fq "getCurrentWindowMetrics" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -Fq "aspect" app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -Fq "packagingOptions {" app/build.gradle
          grep -Fq "pickFirst" app/build.gradle
          echo "AutoInput + LAN/Wi-Fi + Windows Wi-Fi + automatic USB/Bluetooth Keyboard + Auto Screen verification OK"

      - name: Make Gradle executable
        working-directory: winlator
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: winlator
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-11.1-AutoInput-WifiPanel-AutoKeyboard-AutoScreen-debug
          path: winlator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
